<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>Artemis Kids</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#22336b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd85a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd85a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <circle cx="52" cy="11" r="1.4" fill="#fff" opacity=".9"/>
    <circle cx="27" cy="9" r="1" fill="#fff" opacity=".6"/>
    <circle cx="58" cy="26" r="1" fill="#fff" opacity=".6"/>
    <!-- sun sitting on the horizon (cut by the ground) -->
    <circle cx="13" cy="40" r="15" fill="url(#glow)"/>
    <circle cx="13" cy="40" r="8.5" fill="#ffd24a"/>
    <!-- lunar ground -->
    <path d="M0 41 C 14 38, 30 38, 44 40 C 52 41, 58 42, 64 42 L64 64 L0 64 Z" fill="#b6bdca"/>
    <!-- permanently shadowed crater -->
    <ellipse cx="50" cy="57" rx="20" ry="8" fill="#3e4556"/>
    <!-- long shadow of the base, away from the sun -->
    <path d="M44 41 L64 43 L64 45.5 L44 43.5 Z" fill="#3e4556" opacity=".5"/>
    <!-- antenna -->
    <rect x="35.2" y="19" width="1.6" height="10" fill="#e9edf3"/>
    <path d="M31 19.5 A 5 5 0 0 0 41 19.5 Z" fill="#e9edf3"/>
    <!-- habitat dome: lit side toward the sun -->
    <path d="M23 42 A 13 13 0 0 1 49 42 Z" fill="#f5f7fb"/>
    <path d="M36 29 A 13 13 0 0 1 49 42 L40 42 C 41 37, 39 32, 36 29 Z" fill="#cfd5e0"/>
    <!-- door -->
    <path d="M32.5 42 L32.5 38 A 2.5 2.5 0 0 1 37.5 38 L37.5 42 Z" fill="#22336b"/>
  </g>
</svg>
